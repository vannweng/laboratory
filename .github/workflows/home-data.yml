name: Update Zhonghe housing data
# 內政部實價登錄每月 1、11、21 日更新；隔天（台灣時間上午 10:30）抓一次。
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update-moi-data.py'
      - '.github/workflows/home-data.yml'
  schedule:
    - cron: '30 2 2,12,22 * *'
permissions:
  contents: write
concurrency:
  group: home-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and rebuild snapshots
        run: python scripts/update-moi-data.py
      - name: Run tests against the new data
        run: node --test test/*.test.mjs
      - name: Save updated data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/zhonghe-resale.json data/zhonghe-presale.json
          if git diff --cached --quiet; then
            echo "資料沒有變化"
            exit 0
          fi
          git commit -m "Update Zhonghe housing data"
          git pull --rebase origin main
          git push origin HEAD:main
