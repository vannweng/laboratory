<!doctype html>
<html lang="zh-Hant">
<head>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6f2eb" />
  <meta name="description" content="好運小日子，將月經週期、基礎體溫與排卵試紙紀錄保存在自己的裝置上。" />
  <title>好運小日子｜生活實驗室</title>
  <link rel="stylesheet" href="../assets/fertility.css?v=9" />
  <script defer src="../assets/fertility.mjs?v=6"></script>
</head>
<body>
  <main id="app">
    <header class="app-header"><a class="back-link" href="../#works">← 生活實驗室</a></header>

    <section class="intro" aria-labelledby="pageTitle">
      <div><h1 id="pageTitle">好運小日子</h1></div>
      <p id="todayPrompt" class="today-prompt"></p>
    </section>

    <section class="overview" aria-labelledby="overviewTitle">
      <div class="overview-heading"><h2 id="overviewTitle">這次週期</h2></div>
      <div id="cycleSummary" class="summary-cards"></div>
    </section>

    <section class="quick-temperature-card" aria-labelledby="quickTemperatureTitle">
      <div class="quick-temperature-copy"><h2 id="quickTemperatureTitle">基礎體溫紀錄</h2><p id="quickTemperatureDate"></p></div>
      <form id="quickTemperatureForm" class="quick-temperature-form">
        <label>紀錄日期<input id="quickTemperatureEntryDate" type="date" required /></label>
        <label>體溫（°C）<input id="quickTemperature" type="number" min="34" max="42" step="0.01" inputmode="decimal" placeholder="36.55" required /></label>
        <label>量測時間<input id="quickTemperatureTime" type="time" required /></label>
        <button class="primary-button" type="submit">儲存體溫</button>
      </form>
      <p id="quickTemperatureStatus" class="quick-temperature-status" role="status"></p>
    </section>

    <section class="calendar-area" aria-labelledby="calendarTitle">
      <header class="calendar-toolbar">
        <div><h2 id="calendarTitle">週期月曆</h2></div>
        <div class="calendar-nav"><button id="previousMonths" class="round-button" type="button" aria-label="顯示上個月">←</button><button id="todayButton" class="today-button" type="button">今天</button><button id="nextMonths" class="round-button" type="button" aria-label="顯示下個月">→</button></div>
      </header>
      <div id="calendarGrid" class="calendar-grid"></div>
      <ul class="legend" aria-label="月曆圖例">
        <li><i class="legend-period actual"></i>實際月經</li><li><i class="legend-period predicted"></i>預估月經</li><li><i class="legend-fertile"></i>受孕窗口</li><li><i class="legend-ovulation"></i>預估排卵日</li><li><i class="legend-record"></i>已有紀錄</li>
      </ul>
      <p class="disclaimer">受孕期與排卵日依週期推估。基礎體溫與排卵試紙可協助了解身體訊號，但不取代醫療診斷。</p>
    </section>

    <section class="temperature-section" aria-labelledby="temperatureTitle">
      <div><h2 id="temperatureTitle">基礎體溫趨勢</h2></div>
      <div id="temperatureChart" class="temperature-chart"></div>
      <p>每天醒來、下床前以相同方式量測。體溫變化較適合用於回顧週期，請與排卵試紙及分泌物紀錄一起看。</p>
    </section>
    <aside class="settings-card" aria-labelledby="settingsTitle">
      <div class="card-heading"><div><h2 id="settingsTitle">週期設定</h2></div></div>
      <form id="settingsForm" class="settings-form">
        <label>平均週期天數<input id="cycleLength" type="number" min="21" max="45" step="1" inputmode="numeric" required /><span>天</span></label>
        <label>平均經期天數<input id="periodLength" type="number" min="1" max="14" step="1" inputmode="numeric" required /><span>天</span></label>
        <label class="wide">最近一次月經首日<input id="lastPeriodStart" type="date" required /></label>
        <button class="primary-button" type="submit">更新推估</button>
      </form>

      <section class="period-history" aria-labelledby="historyTitle">
        <div class="subheading"><h3 id="historyTitle">月經紀錄</h3><button id="addPeriodButton" class="text-button" type="button">＋ 補登</button></div>
        <ul id="periodList" class="period-list"></ul>
      </section>

    </aside>

  </main>

  <dialog id="dayDialog" class="entry-dialog">
    <form id="dayForm" method="dialog">
      <header><div><h2 id="dayDialogTitle">每日紀錄</h2></div><button class="close-button" value="cancel" aria-label="關閉">×</button></header>
      <input id="recordDate" type="hidden" />
      <div class="record-grid">
        <label>月經量<select id="flow"><option value="">未記錄</option><option value="spotting">點狀出血</option><option value="light">輕</option><option value="medium">中</option><option value="heavy">多</option></select></label>
        <label>基礎體溫（°C）<input id="temperature" type="number" min="34" max="42" step="0.01" inputmode="decimal" placeholder="例如 36.55" /></label>
        <label>量測時間<input id="temperatureTime" type="time" /></label>
        <label>排卵試紙<select id="ovulationTest"><option value="">未測</option><option value="negative">陰性</option><option value="positive">陽性</option></select></label>
        <label class="wide">分泌物<select id="mucus"><option value="">未記錄</option><option value="dry">乾燥</option><option value="sticky">黏稠</option><option value="creamy">乳霜狀</option><option value="watery">水狀</option><option value="eggwhite">蛋清狀</option></select></label>
      </div>
      <fieldset class="intercourse-field"><label><input id="intercourse" type="checkbox" /> 同房</label></fieldset>
      <fieldset class="symptom-field"><legend>身體感受</legend><label><input type="checkbox" value="cramp" /> 腹痛</label><label><input type="checkbox" value="breast" /> 乳房脹痛</label><label><input type="checkbox" value="mood" /> 情緒起伏</label><label><input type="checkbox" value="sleep" /> 睡眠異常</label></fieldset>
      <label class="note-field">備註<textarea id="note" rows="3" placeholder="今天的感受或其他觀察"></textarea></label>
      <footer><button id="deleteRecordButton" class="text-button danger" type="button">刪除本日紀錄</button><button class="primary-button" value="save" type="submit">儲存紀錄</button></footer>
    </form>
  </dialog>

  <dialog id="periodDialog" class="entry-dialog small-dialog">
    <form id="periodForm" method="dialog"><header><div><h2>補登月經</h2></div><button class="close-button" value="cancel" aria-label="關閉">×</button></header><p id="periodPickerHint" class="period-picker-hint">請先選擇月經開始日。</p><div class="period-picker-toolbar"><button id="periodPreviousMonth" class="round-button" type="button" aria-label="顯示上個月">←</button><strong id="periodPickerTitle"></strong><button id="periodNextMonth" class="round-button" type="button" aria-label="顯示下個月">→</button></div><div id="periodPickerCalendar" class="period-picker-calendar" aria-label="選擇月經日期範圍"></div><p id="periodPickerSelection" class="period-picker-selection" aria-live="polite"></p><footer><button class="primary-button" value="save" type="submit" disabled>儲存月經紀錄</button></footer></form>
  </dialog>

</body>
</html>
