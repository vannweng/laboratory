<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f2e9" data-light="#f5f2e9" data-dark="#1c241f" />
  <meta name="description" content="自由生活計畫：用固定報酬與通膨假設試算退休資金、缺口與每月補足金額。" />
  <title>自由生活計畫｜生活實驗室</title>
  <script src="../assets/theme.js"></script>
  <link rel="stylesheet" href="../assets/journal.css" />
  <link rel="stylesheet" href="../assets/controls.css?v=20261019-2" />
  <link rel="stylesheet" href="../assets/fire/retirement.css?v=20261103-6" />
</head>
<body>
  <a class="skip-link" href="#main">跳到主要內容</a>
  <header class="site-header"><div class="header-inner"><a class="brand" href="../" aria-label="生活實驗室首頁"><span class="leaf-mark" aria-hidden="true"><svg><use href="../assets/iconoven.svg#leaf" /></svg></span><span>生活實驗室</span></a><nav class="header-actions" aria-label="網站導覽"><a class="explore-link" href="../#works">作品</a><span class="nav-divider" aria-hidden="true"></span><button class="theme-button" type="button" data-theme-toggle aria-label="切換至暗色模式" aria-pressed="false"><span class="mode-icon mode-light"><svg aria-hidden="true"><use href="../assets/iconoven.svg#sun" /></svg></span><span class="mode-icon mode-dark"><svg aria-hidden="true"><use href="../assets/iconoven.svg#moon" /></svg></span><span class="sr-only" data-theme-label>暗色</span></button></nav></div></header>
  <main id="main" class="site-main retirement-main">
    <a class="breadcrumb" href="../#works">← 回到所有練習作品</a>
    <header class="retirement-intro"><div><h1>自由生活計畫</h1><p class="retirement-scope">退休金與 FIRE 情境試算</p></div><p>用今天的生活費，找出退休時需要準備的資產，以及從現在起每月應補足的金額。</p></header>
    <div class="retirement-grid">
      <form id="retirementForm" class="parameter-panel" novalidate>
        <div class="panel-heading"><h2>你的條件</h2><p>調整後立即更新</p></div>
        <div class="parameter-fields">
          <div class="age-fields">
            <div class="parameter no-range"><label for="currentAge">目前年齡</label><input id="currentAge" name="currentAge" type="number" min="18" max="100" step="1" /></div>
            <div class="parameter no-range"><label for="retirementAge">預計退休年齡</label><input id="retirementAge" name="retirementAge" type="number" min="19" max="105" step="1" /></div>
            <div class="parameter no-range"><label for="lifeAge">規劃用到年齡</label><input id="lifeAge" name="lifeAge" type="number" min="20" max="120" step="1" /></div>
          </div>
          <div class="parameter"><label for="monthlyExpense">退休後每月花費（現值）</label><input id="monthlyExpense" name="monthlyExpense" type="text" inputmode="numeric" data-money role="spinbutton" aria-valuemin="1" autocomplete="off" /><div class="range-with-ticks" data-tick-start="20000" data-tick-every="20000" data-tick-label-every="40000" data-tick-scale="10000"><input data-for="monthlyExpense" type="range" min="10000" max="300000" step="1000" aria-label="退休後每月花費滑桿" /></div></div>
          <div class="parameter"><label for="currentAssets">目前已存退休金</label><input id="currentAssets" name="currentAssets" type="text" inputmode="numeric" data-money role="spinbutton" aria-valuemin="0" autocomplete="off" /><div class="range-with-ticks" data-tick-start="0" data-tick-every="2000000" data-tick-label-every="4000000" data-tick-scale="10000"><input data-for="currentAssets" type="range" min="0" max="30000000" step="100000" aria-label="目前已存退休金滑桿" /></div></div>
          <div class="parameter"><label for="annualReturn">預期年報酬率（%）</label><input id="annualReturn" name="annualReturn" type="number" min="-10" max="20" step="1" /><div class="range-with-ticks" data-tick-start="-10" data-tick-every="2" data-tick-label-every="4" data-tick-suffix="%"><input data-for="annualReturn" type="range" min="-10" max="20" step="1" aria-label="預期年報酬率滑桿" /></div></div>
          <div class="parameter"><label for="inflation">通貨膨脹率（%）</label><input id="inflation" name="inflation" type="number" min="0" max="20" step="1" /><div class="range-with-ticks" data-tick-start="0" data-tick-every="1" data-tick-label-every="2" data-tick-suffix="%"><input data-for="inflation" type="range" min="0" max="10" step="1" aria-label="通貨膨脹率滑桿" /></div><p class="parameter-help">退休後支出會持續依通膨增加。</p></div>
        </div>
        <div class="panel-actions"><button id="resetPlan" class="text-button" type="button">恢復範例</button><span id="saveStatus" class="save-status" role="status"></span></div>
      </form>
      <section class="retirement-results" aria-live="polite">
        <p id="error" class="fire-error" role="alert" hidden></p>
        <div id="summary" class="summary"></div>
        <div class="results-heading"><h2>退休方式比較</h2><button id="exportReport" class="note-button" type="button">下載報告</button></div>
        <div id="resultCards" class="result-cards"></div>
        <section class="chart-section" aria-labelledby="chart-title"><h2 id="chart-title">資產時間軸</h2><p>固定報酬與通膨假設下的年末資產；虛線標示退休時點。</p><div id="chartOutput"></div></section>
      </section>
    </div>
    <p class="local-note">此工具使用固定報酬與通膨假設，只供退休規劃情境參考，不代表投資結果或建議。花本金模式規劃至用到年齡；留存本金模式以年報酬率減通膨率估算可維持本金購買力的資產需求。</p>
  </main>
  <footer class="site-footer"><a href="../">生活實驗室</a><span class="footer-divider" aria-hidden="true"></span><p>這裡的作品皆為練習作品</p></footer>
  <script type="module" src="../assets/fire/app.mjs?v=20261103-6"></script>
</body>
</html>
